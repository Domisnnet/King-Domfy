<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="Entre no KingDomfy para continuar. Acesse sua conta e aproveite o melhor do streaming de música.">
  <title>KingDomfy - Entrar</title>
  <link rel="icon" href="../src/assets/imagens/favicon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="../src/css/estilos-globais.css">
</head>
<body data-base="../">
  <div id="header-placeholder"></div>
  <main class="caixa">
    <div class="container">
      <div class="conteudo-interno">
        <div class="row">
          <div class="col-md-12">
            <h2>Para continuar, entre no KingDomfy.</h2>
            <form>
              <div class="form-group">
                <label for="email">Endereço de e-mail ou nome de usuário</label>
                <input type="email" class="form-control" id="email" placeholder="Endereço de e-mail ou nome de usuário">
              </div>
              <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" class="form-control" id="senha" placeholder="Senha">
              </div>
              <button type="submit" class="btn btn-primary">Entrar</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="footer-placeholder"></div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
  <script src="../src/js/template-loader.js" defer></script>
</body>  
</html>
