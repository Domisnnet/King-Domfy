<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="Inscreva-se grátis no KingDomfy e comece a curtir o melhor do streaming de música. Crie sua conta agora mesmo!">
  <title>KingDomfy - Inscrever-se</title>
  <link rel="icon" href="../src/assets/imagens/favicon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="../src/css/estilos-globais.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <main class="caixa">
    <div class="container">
      <div class="conteudo-interno">
        <div class="row">
          <div class="col-md-12">
            <h2>Inscreva-se grátis para começar a curtir.</h2>
            <form>
              <div class="form-group">
                <label for="email">Qual o seu e-mail?</label>
                <input type="email" class="form-control" id="email" placeholder="Insira seu e-mail.">
              </div>
              <div class="form-group">
                <label for="confirmar-email">Confirme seu e-mail</label>
                <input type="email" class="form-control" id="confirmar-email" placeholder="Insira o e-mail novamente.">
              </div>
              <div class="form-group">
                <label for="senha">Crie uma senha</label>
                <input type="password" class="form-control" id="senha" placeholder="Crie uma senha.">
              </div>
              <div class="form-group">
                <label for="nome">Como devemos chamar você?</label>
                <input type="text" class="form-control" id="nome" placeholder="Insira um nome de perfil.">
              </div>
              <button type="submit" class="btn btn-success">Inscrever-se</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="footer-placeholder"></div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
  <script src="../src/js/template-loader.js" defer></script>
</body>
</html>
